[project]
name = "sprint"
version = "0.1.0"
description = "tiny 8K harness for tiny agents"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "tiktoken; python_version<'3.11'"]

[project.scripts]
sprint = "sprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
