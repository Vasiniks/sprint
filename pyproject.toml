[project]
name = "sprint"
version = "0.3.0"
description = "a tiny terminal agent for tiny models with tiny contexts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["windows-curses; platform_system == 'Windows'"]  # the full screen needs it there; nothing elsewhere

[project.scripts]
sprint = "sprint:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sprint", "sprint_tui"]
