[project]
name = "sprint"
version = "0.1.0"
description = "tiny 8K harness for tiny agents + claude/opencode inspired TUI"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "rich>=13", "textual>=0.60", "psutil>=5.9"]

[project.optional-dependencies]
minimal = ["httpx>=0.27"]

[project.scripts]
sprint = "sprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
