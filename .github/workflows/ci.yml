name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04  # not ubuntu-latest: that became 26.04, for which there is no Python 3.9 to set up
    strategy:
      fail-fast: false  # one version that cannot be set up should not stop the other from being tested
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest -q
      - run: sprint --help
  windows:  # the Windows-only paths (PowerShell, taskkill, curses) run for real here
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e . pytest
      - run: python -m pytest -q test_windows.py
      - run: sprint --help
      - run: python -m pytest -q  # the whole suite too; it was written on a Mac, so this step only informs
        continue-on-error: true
